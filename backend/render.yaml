services:
  - type: web
    name: yesaya-ministry-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn backend.wsgi:application --workers 4 --worker-class sync --worker-tmp-dir /dev/shm --timeout 120 --keepalive 5 --max-requests 1000 --max-requests-jitter 50
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yesaya-ministry-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: srv-d94ldti8qa3s73cuk85g.onrender.com
      - key: REDIS_URL
        fromService:
          type: redis
          name: yesaya-ministry-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MEDIA_ROOT
        value: /opt/render/project/backend/media
    healthCheckPath: /health/
    disk:
      name: data
      mountPath: /opt/render/project/backend/media
      sizeGB: 1

databases:
  - name: yesaya-ministry-db
    databaseName: yesaya_ministry
    user: yesaya_user

  - name: yesaya-ministry-redis
    plan: free
    maxmemoryPolicy: noeviction
